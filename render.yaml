services:
  # ── 1. Backend API Service (FastAPI) ──────────────────────────────────────
  - type: web
    name: trusttrace-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "https://trusttrace-frontend.onrender.com"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-flash-latest"
      - key: DATABASE_URL
        value: "sqlite:///./trusttrace.db"

  # ── 2. Frontend Web Service (Next.js) ────────────────────────────────────
  - type: web
    name: trusttrace-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: 20.12.2
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: trusttrace-backend
          property: host
